name: Android build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    env:
      SLEEP_MONITOR_KEYSTORE_BASE64: ${{ secrets.SLEEP_MONITOR_KEYSTORE_BASE64 }}
      SLEEP_MONITOR_KEYSTORE_PASSWORD: ${{ secrets.SLEEP_MONITOR_KEYSTORE_PASSWORD }}
      SLEEP_MONITOR_KEY_PASSWORD: ${{ secrets.SLEEP_MONITOR_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable signing key
        if: env.SLEEP_MONITOR_KEYSTORE_BASE64 != ''
        run: |
          echo "$SLEEP_MONITOR_KEYSTORE_BASE64" | base64 --decode > app/sleep-monitor-upload.jks
      - name: Build debug APK
        env:
          SLEEP_MONITOR_KEYSTORE_PATH: ${{ github.workspace }}/app/sleep-monitor-upload.jks
          SLEEP_MONITOR_KEY_ALIAS: sleepmonitor
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sleep-monitor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
